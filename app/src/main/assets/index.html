<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SubScout</title>
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E5482D'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M32 32 43 21' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"SubScout","short_name":"SubScout","display":"standalone","background_color":"%23F4F1EA","theme_color":"%23E5482D","icons":[{"src":"data:image/svg+xml,%253Csvg xmlns=%2527http://www.w3.org/2000/svg%2527 viewBox=%25270 0 64 64%2527%253E%253Crect width=%252764%2527 height=%252764%2527 rx=%252714%2527 fill=%2527%2523E5482D%2527/%253E%253Ccircle cx=%252732%2527 cy=%252732%2527 r=%252715%2527 fill=%2527none%2527 stroke=%2527%2523fff%2527 stroke-width=%25274%2527/%253E%253C/svg%253E","sizes":"any","type":"image/svg+xml"}]}'>
<style>
:root{
  --bg:#F4F1EA; --card:#FFFDF8; --ink:#1B1A17; --muted:#6F6A60; --line:#E2DCCF; --soft:#EBE6DB;
  --accent:#E5482D; --accent-ink:#fff; --good:#1F8A5B; --warn:#B87A00; --bad:#C2321B;
  --mono: ui-monospace, "Roboto Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 1px 0 rgba(27,26,23,.04), 0 8px 24px -14px rgba(27,26,23,.25);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121110; --card:#1C1A18; --ink:#F2EEE6; --muted:#9A948A; --line:#2E2B27; --soft:#24211E;
    --accent:#FF6B4A; --accent-ink:#1a0d08; --good:#4CC38A; --warn:#E0A63A; --bad:#FF7A61;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.9); }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.4; overflow-x:hidden}
body{min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit}
input{font:inherit; color:inherit}
h1,h2,h3,p{margin:0}
svg{display:block}

.top{position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  padding:calc(12px + env(safe-area-inset-top)) 18px 10px; display:flex; align-items:center; gap:10px}
.logo{width:34px; height:34px; border-radius:10px; background:var(--accent); display:grid; place-items:center; flex:none}
.logo svg{width:22px; height:22px; color:#fff}
.brand{font-weight:800; letter-spacing:-.02em; font-size:20px}
.brand small{display:block; font-weight:500; letter-spacing:0; font-size:11.5px; color:var(--muted); margin-top:-2px}
.top .sp{flex:1}
.pillbtn{min-height:40px; padding:0 14px; border-radius:999px; background:var(--soft); font-weight:650; font-size:14px; display:inline-flex; align-items:center; gap:7px}
.pillbtn svg{width:17px; height:17px}

main{padding:6px 16px 24px; max-width:560px; margin:0 auto}
.page{display:none} .page.on{display:block}

/* the receipt */
.receipt{background:var(--card); padding:20px 20px 30px; border-radius:16px 16px 0 0; filter:drop-shadow(0 10px 14px rgba(27,26,23,.10));
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat, radial-gradient(circle at 9px 0, #000 8.5px, transparent 9px) bottom left/18px 9px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat, radial-gradient(circle at 9px 0, #000 8.5px, transparent 9px) bottom left/18px 9px repeat-x}
.r-label{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:650}
.r-total{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:44px; font-weight:700; letter-spacing:-.04em; line-height:1.05; margin:6px 0 2px; display:flex; align-items:baseline; flex-wrap:wrap; gap:0 6px}
.r-total .cur{font-size:17px; letter-spacing:0; color:var(--muted); font-weight:600}
.r-total .dec{font-size:24px; color:var(--muted); letter-spacing:-.02em}
.r-total .per{font-family:var(--sans); font-size:14px; letter-spacing:0; color:var(--muted); font-weight:600}
.r-rule{border-top:2px dashed var(--line); margin:14px 0 10px}
.r-row{display:flex; justify-content:space-between; gap:12px; font-size:14.5px; padding:4px 0}
.r-row span{color:var(--muted)} .r-row b{font-weight:650; text-align:right; font-variant-numeric:tabular-nums}
.r-note{font-size:12px; color:var(--muted); margin-top:8px}

.scanbar{display:flex; align-items:center; gap:12px; margin:18px 2px 6px}
.btn{min-height:48px; padding:0 20px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-weight:750; font-size:15.5px; display:inline-flex; align-items:center; justify-content:center; gap:9px}
.btn svg{width:19px; height:19px; flex:none}
.scanbar .btn{white-space:nowrap; flex:none}
.btn.wide{width:100%} .btn.ghost{background:var(--soft); color:var(--ink)} .btn.line{background:none; border:1.5px solid var(--line); color:var(--ink)}
.btn.danger{background:none; border:1.5px solid color-mix(in srgb, var(--bad) 50%, var(--line)); color:var(--bad)}
.btn:disabled{opacity:.55}
.scanbar .when{font-size:12.5px; color:var(--muted); line-height:1.3}

.progress{background:var(--card); border-radius:14px; padding:14px 16px; margin:16px 0 4px; box-shadow:var(--shadow)}
.progress p{font-size:14px; font-weight:600}
.bar{height:6px; border-radius:6px; background:var(--soft); margin-top:10px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:6px; transition:width .35s ease}

.banner{display:flex; align-items:center; gap:10px; background:color-mix(in srgb, var(--warn) 14%, var(--card)); border-radius:12px; padding:10px 12px 10px 14px; font-size:13.5px; margin:14px 0 0}
.banner b{font-weight:700} .banner .sp{flex:1}
.banner button{min-height:36px; padding:0 12px; border-radius:10px; background:var(--card); font-weight:650; font-size:13px}

.sec{display:flex; align-items:baseline; gap:8px; margin:24px 4px 8px}
.sec h2{font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:750}
.sec span{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.sec.bad h2{color:var(--bad)}
.hint{font-size:13px; color:var(--muted); margin:-2px 4px 8px}
.list{background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
.row{display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; min-height:64px; border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.ava{width:40px; height:40px; border-radius:12px; flex:none; display:grid; place-items:center; font-weight:800; font-size:16px; color:#fff; background:hsl(var(--h) 42% 42%)}
.r-main{flex:1; min-width:0}
.r-name{display:block; font-weight:700; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.r-meta{display:block; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.r-meta.bad{color:var(--bad); font-weight:600} .r-meta.warn{color:var(--warn); font-weight:600}
.r-amt{text-align:right; flex:none}
.r-amt b{display:block; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14.5px; font-weight:700; letter-spacing:-.02em}
.r-amt small{display:flex; justify-content:flex-end; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); margin-top:2px}
.r-amt small svg{width:13px; height:13px}
details.ended{margin-top:18px}
details.ended summary{list-style:none; display:flex; align-items:center; gap:8px; padding:10px 4px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:750; color:var(--muted); min-height:44px}
details.ended summary::-webkit-details-marker{display:none}
details.ended summary svg{width:16px; height:16px; transition:transform .2s}
details.ended[open] summary svg{transform:rotate(90deg)}
details.ended .row{opacity:.72}

.empty{text-align:center; padding:26px 8px 6px}
.empty .radar{width:120px; height:120px; margin:0 auto 14px; color:var(--accent)}
.empty h2{font-size:21px; letter-spacing:-.02em; font-weight:800}
.empty p{color:var(--muted); font-size:14.5px; margin:6px auto 0; max-width:320px}
.steps{background:var(--card); border-radius:16px; box-shadow:var(--shadow); margin-top:20px; text-align:left; overflow:hidden}
.step{display:flex; align-items:center; gap:12px; padding:13px 14px; border-top:1px solid var(--line); width:100%; min-height:60px}
.step:first-child{border-top:0}
.step .n{width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:800; font-size:13px; background:var(--soft)}
.step.done .n{background:var(--good); color:#fff}
.step .n svg{width:15px; height:15px}
.step b{display:block; font-size:15px} .step small{display:block; color:var(--muted); font-size:12.5px}
.step .go{margin-left:auto; color:var(--muted)} .step .go svg{width:18px; height:18px}

/* cards on Sources / Settings */
.card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:16px; margin-top:14px}
.card h3{font-size:16.5px; font-weight:800; letter-spacing:-.01em; display:flex; align-items:center; gap:9px}
.card h3 svg{width:20px; height:20px; color:var(--accent)}
.card h3 .state{margin-left:auto; font-size:12px; font-weight:750; padding:3px 9px; border-radius:999px; background:var(--soft); color:var(--muted); letter-spacing:.02em}
.card h3 .state.on{background:color-mix(in srgb, var(--good) 16%, transparent); color:var(--good)}
.card p{font-size:14px; color:var(--muted); margin-top:8px}
.card p b{color:var(--ink)}
.card ol{margin:10px 0 0; padding-left:20px; font-size:14px; color:var(--muted)}
.card ol li{margin:5px 0} .card ol b{color:var(--ink)}
.card .btn{margin-top:14px}
.acct{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); margin-top:12px; font-size:14.5px; font-weight:650}
.acct + .acct{margin-top:0}
.acct span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.acct button{min-height:40px; padding:0 12px; border-radius:10px; color:var(--bad); font-weight:650; font-size:13.5px}
label.f{display:block; margin-top:12px; font-size:12.5px; font-weight:650; color:var(--muted)}
label.f input{display:block; width:100%; margin-top:5px; min-height:48px; padding:0 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font-size:16px; font-weight:500; color:var(--ink); outline:none}
label.f input:focus{border-color:var(--accent)}
label.f input.mono{font-family:var(--mono); letter-spacing:.04em}
.err{color:var(--bad)!important; font-weight:600}
details.more{margin-top:12px}
details.more summary{font-size:14px; font-weight:650; color:var(--accent); min-height:40px; display:flex; align-items:center; list-style:none}
details.more summary::-webkit-details-marker{display:none}
.seg{display:flex; gap:6px; margin-top:12px; background:var(--soft); padding:4px; border-radius:12px}
.seg button{flex:1; min-height:42px; border-radius:9px; text-align:center; font-weight:650; font-size:14px; color:var(--muted)}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ptitle{font-size:26px; font-weight:800; letter-spacing:-.03em; margin:8px 4px 0}
.psub{color:var(--muted); font-size:14.5px; margin:2px 4px 0}
footer{font-size:11.5px; color:var(--muted); text-align:center; padding:26px 12px 6px; line-height:1.5}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:6; background:color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line); display:flex; padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11.5px; font-weight:650; color:var(--muted); border-radius:12px}
.tabs button svg{width:23px; height:23px}
.tabs button.on{color:var(--accent)}

/* detail sheet */
.scrim{position:fixed; inset:0; z-index:8; background:rgba(10,8,6,.5); opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:9; max-height:88vh; overflow:auto; background:var(--bg); border-radius:22px 22px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%); transition:transform .26s cubic-bezier(.2,.8,.2,1); max-width:560px; margin:0 auto}
.sheet.on{transform:none}
.grab{width:42px; height:5px; border-radius:5px; background:var(--line); margin:0 auto 12px}
.s-head{display:flex; align-items:center; gap:12px}
.s-head .ava{width:50px; height:50px; border-radius:15px; font-size:20px}
.s-head h2{font-size:21px; font-weight:800; letter-spacing:-.02em; line-height:1.15}
.s-head p{font-size:13px; color:var(--muted)}
.s-head .x{margin-left:auto; width:44px; height:44px; border-radius:50%; background:var(--soft); display:grid; place-items:center; flex:none}
.s-head .x svg{width:18px; height:18px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--soft); margin:12px 6px 0 0}
.chip svg{width:14px; height:14px}
.chip.good{background:color-mix(in srgb, var(--good) 16%, transparent); color:var(--good)}
.chip.bad{background:color-mix(in srgb, var(--bad) 15%, transparent); color:var(--bad)}
.chip.warn{background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn)}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.stat{background:var(--card); border-radius:14px; padding:12px 14px}
.stat small{display:block; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:650}
.stat b{display:block; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; letter-spacing:-.03em; margin-top:3px}
.stat b.t{font-family:var(--sans); letter-spacing:-.01em}
.stat em{display:block; font-style:normal; font-size:12px; color:var(--muted); margin-top:1px}
.sheet h4{font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:750; margin:20px 2px 8px}
.hist{background:var(--card); border-radius:14px; overflow:hidden}
.hist div{display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line); font-size:14px}
.hist div:first-child{border-top:0}
.hist span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hist time{color:var(--muted); font-size:12.5px; flex:none; width:78px}
.hist b{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:650; font-size:13.5px; flex:none}
.hist svg{width:14px; height:14px; color:var(--muted); flex:none}
.sheet .btn{margin-top:18px}

.toast{position:fixed; left:50%; bottom:calc(98px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); z-index:12; background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600; max-width:calc(100vw - 40px); opacity:0; pointer-events:none; transition:all .22s; text-align:center}
.toast.on{opacity:1; transform:translate(-50%, 0)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 12l5.2-5.2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></div>
  <div class="brand">SubScout<small>Every subscription, one list</small></div>
  <div class="sp"></div>
  <button class="pillbtn" data-act="scan" id="topScan" aria-label="Scan now"></button>
</header>
<main>
  <section class="page on" id="p-home"></section>
  <section class="page" id="p-sources"></section>
  <section class="page" id="p-settings"></section>
</main>
<nav class="tabs" id="tabs"></nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script id="engine">
/* SubScout detection engine: turns emails and bank alerts into a list of subscriptions.
   Pure functions, no DOM, so it can be tested on its own. */
const Engine = (() => {
  'use strict';
  const DAY = 86400000;

  /* ---------- money ---------- */
  // Rates to AED. USD, SAR, QAR, BHD and OMR are pegged; the rest are rough and shown with "≈".
  const RATE = { AED: 1, USD: 3.6725, SAR: 0.979, QAR: 1.009, BHD: 9.74, OMR: 9.54, KWD: 11.95, EUR: 4.0, GBP: 4.7, PHP: 0.064, INR: 0.043, CAD: 2.65, AUD: 2.4, SGD: 2.8, JPY: 0.024, CHF: 4.3, TRY: 0.09, EGP: 0.075 };
  const CODES = Object.keys(RATE).join('|');
  const NUM = '(\\d{1,3}(?:,\\d{3})+(?:\\.\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)';
  const RE_MONEY = new RegExp('(?:(?:\\b(' + CODES + ')|(US\\$|A\\$|C\\$|S\\$|\\$|€|£|₱|₹|د\\.إ|\\bDhs?\\.?))\\s?' + NUM + '|' + NUM + '\\s?(?:(' + CODES + ')\\b|(€|£)))', 'gi');
  const SYM = { 'US$': 'USD', 'A$': 'AUD', 'C$': 'CAD', 'S$': 'SGD', '$': 'USD', '€': 'EUR', '£': 'GBP', '₱': 'PHP', '₹': 'INR', 'د.إ': 'AED' };

  function parseNum(s) {
    if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return parseFloat(s.replace(/,/g, ''));
    if (/^\d+,\d{1,2}$/.test(s)) return parseFloat(s.replace(',', '.'));
    return parseFloat(s);
  }
  function findMoney(text) {
    const out = []; if (!text) return out;
    RE_MONEY.lastIndex = 0; let m;
    while ((m = RE_MONEY.exec(text))) {
      const code = m[1] || m[5]; const sym = m[2] || m[6];
      let cur = code ? code.toUpperCase() : (SYM[sym] || SYM[(sym || '').toUpperCase()] || (/^dh/i.test(sym || '') ? 'AED' : null));
      const amount = parseNum(m[3] || m[4]);
      if (!cur || !isFinite(amount) || amount >= 100000) continue;
      out.push({ amount, cur, idx: m.index, end: m.index + m[0].length });
    }
    return out;
  }
  function toAED(amount, cur) { return amount * (RATE[cur] || 1); }

  /** Best guess at "what was charged" in a receipt. */
  function pickAmount(subject, body) {
    let best = null;
    const consider = (text, bonus) => {
      for (const f of findMoney(text)) {
        if (f.amount <= 0) continue;
        const before = text.slice(Math.max(0, f.idx - 45), f.idx).toLowerCase();
        let score = bonus - f.idx / 20000;
        if (/total|amount|charged|you paid|payment of|billed|price|renew/.test(before)) score += 4;
        if (/\btotal\b/.test(before) && !/sub-?total/.test(before)) score += 2;
        if (/(sub-?total|tax|vat|discount|saved?|saving|balance|limit|credit|was|instead of|off|shipping|fee)\W{0,6}$/.test(before.slice(-26))) score -= 5;
        if (!best || score > best.score) best = { amount: f.amount, cur: f.cur, score, after: text.slice(f.end, f.end + 22) };
      }
    };
    consider(subject || '', 3);
    consider((body || '').slice(0, 6000), 0);
    return best;
  }

  /* ---------- dates ---------- */
  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  const MRE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';
  const RE_D1 = new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?[ -]' + MRE + '(?:,?[ -](\\d{4}))?', 'i');
  const RE_D2 = new RegExp('\\b' + MRE + ' (\\d{1,2})(?:st|nd|rd|th)?(?:,? (\\d{4}))?', 'i');
  const RE_D3 = /\b(\d{4})-(\d{2})-(\d{2})\b/;

  else if (s.status === 'cancelled') meta = 'Cancelled ' + dShort(s.cancelledOn || s.last);
  else if (s.status === 'lapsed') meta = 'No charge seen since ' + dShort(s.last);
  else meta = PER[s.per] + (s.next ? ' · next ' + dShort(s.next) + (dayDiff(s.next) <= 7 ? ' (' + rel(s.next) + ')' : '') : '');
  const sub = s.cur && s.cur !== 'AED' && s.monthlyAED != null ? (s.approx ? '≈ ' : '') + 'AED ' + s.monthlyAED.toFixed(2) + '/mo' : (s.per !== 'month' && s.monthlyAED != null ? 'AED ' + s.monthlyAED.toFixed(2) + '/mo' : '');
  return '<button class="row" data-act="open" data-key="' + esc(s.key) + '">' + ava(s) +
    '<span class="r-main"><span class="r-name">' + esc(s.name) + '</span><span class="r-meta ' + cls + '">' + esc(meta) + '</span></span>' +
    '<span class="r-amt"><b>' + (s.amount == null ? '–' : esc(money(s.amount, s.cur)) + (s.status === 'trial' ? '' : '')) + '</b><small>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + srcIcons(s) + '</small></span></button>';
}
const block = (title, items, cls, hint) => !items.length ? '' :
  '<div class="sec ' + (cls || '') + '"><h2>' + title + '</h2><span>' + items.length + '</span></div>' + (hint ? '<p class="hint">' + hint + '</p>' : '') + '<div class="list">' + items.map(rowHtml).join('') + '</div>';

function renderHome() {
  const el = $('#p-home'); const inf = info();
  const shown = subs.filter(s => !s.hidden);
  let h = '';
  if (scanning) h += '<div class="progress"><p>' + esc(scanning.label) + '</p><div class="bar"><i style="width:' + Math.round(scanning.pct) + '%"></i></div></div>';
  if (!shown.length) {
    const hasMail = inf.accounts.length > 0;
    h += '<div class="empty"><div class="radar">' + I.radar + '</div><h2>' + (state.lastScan ? 'Nothing found yet' : 'Find what you’re paying for') + '</h2><p>' +
      (state.lastScan ? 'No subscriptions turned up in the last scan. Add another source or scan further back in Settings.' : 'SubScout reads your receipts and card-charge alerts, then lists every subscription with its price and next charge.') + '</p>' +
      '<div class="steps">' +
      '<button class="step ' + (hasMail ? 'done' : '') + '" data-act="go" data-tab="sources"><span class="n">' + (hasMail ? I.check : '1') + '</span><span><b>Connect your email</b><small>' + (hasMail ? esc(inf.accounts.map(a => a.email).join(', ')) : 'Receipts, renewals and trial emails') + '</small></span><span class="go">' + I.chev + '</span></button>' +
      '<button class="step ' + (inf.notif ? 'done' : '') + '" data-act="go" data-tab="sources"><span class="n">' + (inf.notif ? I.check : '2') + '</span><span><b>Turn on bank alerts</b><small>' + (inf.notif ? inf.alerts + ' card charges saved so far' : 'Catches charges that never send an email') + '</small></span><span class="go">' + I.chev + '</span></button>' +
      '<button class="step" data-act="scan"><span class="n">3</span><span><b>Scan</b><small>Takes a minute or two the first time</small></span><span class="go">' + I.chev + '</span></button>' +
      '</div><button class="btn ghost wide" data-act="demo" style="margin-top:14px">See it with sample data</button></div>';
    el.innerHTML = h + foot(); return;
  }
  const t = Engine.totals(subs);
  const whole = Math.floor(t.monthly), dec = (t.monthly - whole).toFixed(2).slice(1);
  h += '<section class="receipt"><div class="r-label">You’re paying about</div>' +
    '<div class="r-total"><span class="cur">AED</span>' + whole.toLocaleString('en-US') + '<span class="dec">' + dec + '</span><span class="per">a month</span></div>' +
    '<div class="r-rule"></div>' +
    '<div class="r-row"><span>Per year</span><b>AED ' + Math.round(t.yearly).toLocaleString('en-US') + '</b></div>' +
    '<div class="r-row"><span>Active subscriptions</span><b>' + t.count + '</b></div>' +
    (t.upcoming ? '<div class="r-row"><span>' + (t.upcoming.status === 'trial' ? 'Trial ends' : 'Next charge') + '</span><b>' + esc(t.upcoming.name) + ' · ' + rel(t.upcoming.next) + '</b></div>' : '') +
    (t.approx ? '<p class="r-note">≈ Some prices are in another currency and converted to AED at a rough rate.</p>' : '') + '</section>';
  if (state.demo) h += '<div class="banner"><span><b>Sample data.</b> None of this is yours.</span><span class="sp"></span><button data-act="clear-demo">Clear</button></div>';
  h += '<div class="scanbar"><button class="btn" data-act="scan"' + (scanning ? ' disabled' : '') + '>' + I.scan + (scanning ? 'Scanning…' : 'Scan now') + '</button><span class="when">' +
    (state.demo ? 'Scan to replace the samples with your own.' : state.lastScan ? 'Last scan ' + rel(state.lastScan) + (state.stats ? '<br>' + (state.stats.more ? state.stats.more + ' emails still to read, scan again' : state.stats.mails + ' emails · ' + state.stats.alerts + ' bank alerts') : '') : '') + '</span></div>';
  const sure = shown.filter(s => s.conf !== 'low');
  h += block('Needs attention', sure.filter(s => s.status === 'failed'), 'bad');
  h += block('Free trials', sure.filter(s => s.status === 'trial'));
  h += block('Active', sure.filter(s => s.status === 'active'));
  h += block('Possible', shown.filter(s => s.conf === 'low' && s.status === 'active'), '', 'The same amount was charged twice. Open one to check it.');
  const ended = shown.filter(s => s.status === 'cancelled' || s.status === 'lapsed');
  if (ended.length) h += '<details class="ended"><summary>' + I.chev + 'Ended or stopped · ' + ended.length + '</summary><div class="list">' + ended.map(rowHtml).join('') + '</div></details>';
  el.innerHTML = h + foot();
}
const foot = () => '<footer>' + esc(CREDIT) + '</footer>';

/* ---------- Sources ---------- */
function renderSources() {
  const inf = info(); let h = '<h1 class="ptitle">Sources</h1><p class="psub">Where SubScout looks for subscriptions.</p>';
  // email
  h += '<div class="card"><h3>' + I.mail + 'Email<span class="state ' + (inf.accounts.length ? 'on' : '') + '">' + (inf.accounts.length ? inf.accounts.length + ' connected' : 'Not connected') + '</span></h3>';
  if (!NATIVE) h += '<p>Reading your inbox works in the Android app. Here in the browser you can try the sample data.</p>';
  else {
    h += inf.accounts.map(a => '<div class="acct"><span>' + esc(a.email) + '</span><button data-act="rm-acct" data-id="' + esc(a.id) + '">Remove</button></div>').join('');
    h += '<p style="margin-top:14px"><b>Add a Gmail account</b></p><ol>' +
      '<li>Tap <b>Open Google app passwords</b> below and sign in. If Google says app passwords aren’t available, turn on <b>2-Step Verification</b> in your Google Account first.</li>' +
      '<li>Type <b>SubScout</b> as the name and tap <b>Create</b>.</li>' +
      '<li>Copy the <b>16-letter password</b> Google shows and paste it here.</li></ol>' +
      '<button class="btn line wide" data-act="open-url" data-url="https://myaccount.google.com/apppasswords">Open Google app passwords</button>' +
      '<label class="f">Email address<input id="f-email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="you@gmail.com" value="' + esc(form.email) + '"></label>' +
      '<label class="f">App password (16 letters)<input id="f-pass" class="mono" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="abcd efgh ijkl mnop" value="' + esc(form.pass) + '"></label>' +
      '<details class="more"' + (showOther ? ' open' : '') + '><summary data-act="other">Not Gmail? (Yahoo, iCloud, others)</summary>' +
      '<p style="margin-top:0">Use an app password from that provider. Leave the server empty and SubScout will work it out, or type it, for example <b>imap.mail.yahoo.com</b>. Outlook and Hotmail are not supported yet.</p>' +
      '<label class="f">Mail server (optional)<input id="f-host" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="imap.example.com" value="' + esc(form.host) + '"></label></details>' +
      (formErr ? '<p class="err">' + esc(formErr) + '</p>' : '') +
      '<button class="btn wide" data-act="add-acct"' + (adding ? ' disabled' : '') + '>' + (adding ? 'Checking…' : 'Connect') + '</button>' +
      '<p>SubScout only reads. It never deletes, sends or marks emails as read. The app password is stored encrypted on this phone and you can delete it in your Google Account any time.</p>';
  }
  h += '</div>';
  // bank alerts
  h += '<div class="card"><h3>' + I.bell + 'Bank alerts<span class="state ' + (inf.notif ? 'on' : '') + '">' + (inf.notif ? 'On' : 'Off') + '</span></h3>';
  if (!NATIVE) h += '<p>Card-charge alerts are picked up by the Android app.</p>';
  else if (inf.notif) h += '<p><b>' + inf.alerts + ' card ' + (inf.alerts === 1 ? 'charge' : 'charges') + ' saved</b>' + (inf.alertsSince ? ' since ' + dShort(inf.alertsSince) : '') + '. SubScout notes each card-charge alert as it arrives, from your bank’s SMS and from Google or Samsung Wallet. A charge that repeats shows up as a subscription after its second month.</p>' +
    '<button class="btn line wide" data-act="notif">Notification access settings</button>';
  else h += '<p>Your bank texts you for every card charge. With notification access on, SubScout keeps the ones that look like a card charge and spots the charges that repeat. It starts from today; your email scan covers the months before.</p>' +
    '<button class="btn wide" data-act="notif">Turn on</button>' +
    '<details class="more"><summary>The switch is greyed out?</summary><ol><li>Tap <b>Open app settings</b> below.</li><li>Tap <b>⋮</b> at the top right, then <b>Allow restricted settings</b>.</li><li>Come back and tap <b>Turn on</b> again.</li></ol><button class="btn line wide" data-act="app-settings">Open app settings</button></details>' +
    '<p>Everything stays on this phone. Chat apps and one-time codes are ignored.</p>';
  h += '</div>';
  h += '<div class="card"><h3>' + I.list + 'Sample data</h3><p>See how the list looks with made-up subscriptions. Your next real scan replaces them.</p><button class="btn ghost wide" data-act="demo">Load sample data</button></div>';
  $('#p-sources').innerHTML = h + foot();
}

/* ---------- Settings ---------- */
function renderSettings() {
  const inf = info(); const nHidden = Object.keys(state.hidden).length;
  let h = '<h1 class="ptitle">Settings</h1>';
  h += '<div class="card"><h3>How far back to scan</h3><p>Longer finds yearly subscriptions, but takes more time.</p><div class="seg">' +
    [6, 12, 24].map(m => '<button data-act="months" data-m="' + m + '" class="' + (state.months === m ? 'on' : '') + '">' + m + ' months</button>').join('') + '</div></div>';
  h += '<div class="card"><h3>Hidden items</h3><p>' + (nHidden ? '<b>' + nHidden + '</b> marked as not a subscription.' : 'Nothing hidden. Open any item and tap “Not a subscription” to hide it.') + '</p>' +
    (nHidden ? '<button class="btn ghost wide" data-act="unhide">Show them again</button>' : '') + '</div>';
  h += '<div class="card"><h3>Your data</h3><p>Everything SubScout finds is kept on this phone only. Nothing is uploaded. The only connection it makes is straight to your mail provider to read receipts.</p>' +
    '<button class="btn danger wide" data-act="wipe">Clear all results</button></div>';
  h += '<div class="card"><h3>About</h3><p>SubScout ' + esc(inf.version) + '</p></div>';
  $('#p-settings').innerHTML = h + foot();
}

/* ---------- detail sheet ---------- */
function renderSheet() {
  const s = subs.find(x => x.key === sheetKey); const el = $('#sheet');
  if (!s) { closeSheet(); return; }
  const st = { active: ['good', 'Active'], trial: ['warn', 'Free trial'], failed: ['bad', 'Payment problem'], cancelled: ['', 'Cancelled'], lapsed: ['', 'No recent charge'] }[s.status];
  let h = '<div class="grab"></div><div class="s-head">' + ava(s) + '<div><h2>' + esc(s.name) + '</h2><p>' + esc(s.cat) + (s.via ? ' · billed through ' + esc(s.via) : '') + '</p></div><button class="x" data-act="close" aria-label="Close">' + I.x + '</button></div>';
  h += '<span class="chip ' + st[0] + '">' + (s.status === 'failed' ? I.warn : '') + st[1] + '</span>' +
    (s.conf === 'low' ? '<span class="chip warn">Not sure yet</span>' : '') +
    (s.src.includes('mail') ? '<span class="chip">' + I.mail + 'Email</span>' : '') + (s.src.includes('alert') ? '<span class="chip">' + I.bell + 'Bank alert</span>' : '');
  const yearly = s.monthlyAED != null ? s.monthlyAED * 12 : null;
  h += '<div class="grid">' +
    '<div class="stat"><small>Price</small><b>' + esc(money(s.amount, s.cur)) + '</b><em>' + (s.cur && s.cur !== 'AED' && s.monthlyAED != null ? (s.approx ? '≈ ' : '') + 'AED ' + (s.monthlyAED / Engine.PER_MONTHLY[s.per]).toFixed(2) + (s.approx ? '' : ' on your card') : (s.status === 'trial' ? 'after the trial' : '&nbsp;')) + '</em></div>' +
    '<div class="stat"><small>Billing</small><b class="t">' + PER[s.per] + '</b><em>' + (s.perGuess ? 'Guessed, only one charge seen' : '&nbsp;') + '</em></div>' +
    '<div class="stat"><small>' + (s.status === 'trial' ? 'Trial ends' : 'Next charge') + '</small><b class="t">' + (s.next ? dShort(s.next) : '–') + '</b><em>' + (s.next ? rel(s.next) : (s.status === 'cancelled' ? 'Cancelled ' + dShort(s.cancelledOn || s.last) : s.status === 'lapsed' ? 'Last seen ' + dShort(s.last) : '&nbsp;')) + '</em></div>' +
    '<div class="stat"><small>Per year</small><b>' + (yearly != null ? (s.approx ? '≈ ' : '') + 'AED ' + Math.round(yearly).toLocaleString('en-US') : '–') + '</b><em>' + (s.monthlyAED != null ? 'AED ' + s.monthlyAED.toFixed(2) + ' a month' : '&nbsp;') + '</em></div></div>';
  if (s.charges.length) h += '<h4>Charges found</h4><div class="hist">' + s.charges.map(c => '<div><time>' + dShort(c.date) + '</time><span>' + (c.paid != null && c.cur !== 'AED' ? 'AED ' + c.paid.toFixed(2) + ' on card' : '') + '</span>' + (c.src.includes('mail') ? I.mail : '') + (c.src.includes('alert') ? I.bell : '') + '<b>' + esc(money(c.amount, c.cur)) + '</b></div>').join('') + '</div>';
  const notes = s.notes.filter(n => n.src === 'mail');
  if (notes.length) h += '<h4>Recent emails</h4><div class="hist">' + notes.map(n => '<div><time>' + dShort(n.date) + '</time><span>' + esc(n.sub) + '</span></div>').join('') + '</div>';
  h += s.hidden ? '<button class="btn ghost wide" data-act="unhide-one">Show in my list again</button>' : '<button class="btn line wide" data-act="hide">Not a subscription</button>';
  el.innerHTML = h;
}
function openSheet(key) { sheetKey = key; renderSheet(); $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); $('#sheet').scrollTop = 0; }
function closeSheet() { sheetKey = null; $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }

/* ---------- shell ---------- */
function renderTabs() {
  $('#tabs').innerHTML = [['home', 'Subscriptions', I.list], ['sources', 'Sources', I.plug], ['settings', 'Settings', I.gear]]
    .map(t => '<button data-act="go" data-tab="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + t[2] + t[1] + '</button>').join('');
  $('#topScan').innerHTML = I.scan + (scanning ? 'Scanning…' : 'Scan');
  $('#topScan').style.display = tab === 'home' ? 'none' : '';
}
function render() {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + tab));
  renderTabs();
  if (tab === 'home') renderHome(); else if (tab === 'sources') renderSources(); else renderSettings();
  if (sheetKey) renderSheet();
}
function go(t) { tab = t; formErr = ''; render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
function loadDemo() {
  const now = Date.now(); const d = Engine.demo(now); const evs = [];
  const want = new Set(Engine.triage(d.mails));
  for (const m of d.mails) { const e = Engine.mailEvent(Object.assign({}, m, { text: want.has(m.u) ? m.text : '' }), 'demo'); if (e) evs.push(e); }
  for (const a of d.alerts) { const e = Engine.alertEvent(a); if (e) evs.push(e); }
  state.events = evs; state.demo = true; state.lastScan = 0; state.stats = null; save(); rebuild(); go('home');
  toast('Sample data loaded');
}
const setScan = (label, pct) => { scanning = { label, pct }; if (tab === 'home') renderHome(); renderTabs(); };
async function scan() {
  if (scanning) return;
  if (!NATIVE) { toast('Scanning works in the Android app. Try the sample data here.'); return; }
  const inf = info();
  if (!inf.accounts.length && !inf.notif) { go('sources'); toast('Connect an email or turn on bank alerts first.'); return; }
  go('home'); setScan('Starting…', 3);
  const byId = new Map(); const errors = []; let nMails = 0, nAlerts = 0, more = 0;
  if (state.ev !== EV || state.demo) { state.seen = {}; state.ev = EV; }
  const cutoff = Date.now() - state.months * 31 * Engine.DAY;
  try {
    for (const acc of inf.accounts) {
      const mine = state.demo ? [] : state.events.filter(x => x.id.indexOf('m:' + acc.id + ':') === 0);
      setScan('Looking through ' + acc.email + '…', 6);
      try {
        const headers = await call('mailHeaders', [acc.id, state.months]);
        nMails += headers.length;
        const seen = new Set(state.seen[acc.id] || []);
        const fresh = headers.filter(h => !seen.has(h.u));           // emails not read on an earlier scan
        const wantAll = Engine.triage(fresh); const want = wantAll.slice(0, BATCH); const later = new Set(wantAll.slice(BATCH));
        more += later.size;
        setScan('Found ' + headers.length + ' emails. Reading ' + want.length + ' new ones…', 18);
        let bodies = {};
        if (want.length) bodies = await call('mailBodies', [acc.id, JSON.stringify(want)], m => { const p = String(m).split('/'); setScan('Reading receipts, ' + p[0] + ' of ' + p[1] + '…', 18 + 72 * (+p[0] / Math.max(1, +p[1]))); });
        mine.filter(x => x.date >= cutoff).forEach(x => byId.set(x.id, x));
        for (const h of fresh) { const e = Engine.mailEvent({ u: h.u, f: h.f, s: h.s, d: h.d, text: (bodies && bodies[h.u]) || '' }, acc.id); if (e) byId.set(e.id, e); }
        state.seen[acc.id] = headers.filter(h => !later.has(h.u)).map(h => h.u);
      } catch (e) {
        errors.push(acc.email + ': ' + e.message);
        mine.forEach(x => byId.set(x.id, x));                        // keep what we had for this inbox
      }
    }
    setScan('Checking bank alerts…', 94);
    let alerts = []; try { alerts = JSON.parse(NATIVE.alerts()); } catch (e) { }
    nAlerts = alerts.length;
    for (const a of alerts) { const e = Engine.alertEvent(a); if (e) byId.set(e.id, e); }
    state.events = Array.from(byId.values()); state.demo = false; state.lastScan = Date.now(); state.stats = { mails: nMails, alerts: nAlerts, more }; save();
  } finally { scanning = null; rebuild(); render(); }
  const n = subs.filter(s => !s.hidden && (s.status === 'active' || s.status === 'trial' || s.status === 'failed')).length;
  toast(errors.length ? errors[0] : more ? 'Read ' + BATCH + ' emails. Scan again to read ' + more + ' more.' : n ? 'Found ' + n + ' subscription' + (n === 1 ? '' : 's') : 'Scan finished. Nothing found yet.');
}
async function addAccount() {
  if (adding) return;
  const email = form.email.trim().toLowerCase(), pass = form.pass.replace(/\s+/g, ''), host = form.host.trim().toLowerCase();
  const fail = m => { formErr = m; renderSources(); };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('Type your full email address.');
  if (/@(outlook|hotmail|live|msn)\./.test(email)) return fail('Outlook and Hotmail are not supported yet.');
  if (pass.length < 8) return fail('Paste the app password from Google. It is 16 letters, not your normal password.');
  adding = true; formErr = ''; renderSources();
  try { await call('addAccount', [JSON.stringify({ email, pass, host })]); adding = false; form.email = form.pass = form.host = ''; renderSources(); toast('Connected. Tap Scan to look for subscriptions.'); }
  catch (e) { adding = false; fail(e.message); }
}
document.addEventListener('input', ev => { const k = { 'f-email': 'email', 'f-pass': 'pass', 'f-host': 'host' }[ev.target.id]; if (k) form[k] = ev.target.value; });

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'go') go(b.dataset.tab);
  else if (act === 'scan') scan();
  else if (act === 'demo') loadDemo();
  else if (act === 'clear-demo') { state.events = []; state.demo = false; save(); rebuild(); render(); }
  else if (act === 'open') openSheet(b.dataset.key);
  else if (act === 'close') closeSheet();
  else if (act === 'hide') { state.hidden[sheetKey] = 1; save(); rebuild(); closeSheet(); render(); toast('Hidden. You can bring it back in Settings.'); }
  else if (act === 'unhide-one') { delete state.hidden[sheetKey]; save(); rebuild(); render(); }
  else if (act === 'unhide') { state.hidden = {}; save(); rebuild(); render(); toast('All items are showing again'); }
  else if (act === 'months') { state.months = +b.dataset.m; save(); renderSettings(); }
  else if (act === 'wipe') { if (b.dataset.sure) { state.events = []; state.hidden = {}; state.seen = {}; state.demo = false; state.lastScan = 0; state.stats = null; save(); rebuild(); render(); toast('Results cleared'); } else { b.dataset.sure = 1; b.textContent = 'Tap again to clear'; } }
  else if (act === 'other') { showOther = !showOther; }
  else if (act === 'add-acct') addAccount();
  else if (act === 'rm-acct') { if (b.dataset.sure) { try { NATIVE.removeAccount(b.dataset.id); } catch (e) { } state.events = state.events.filter(x => x.id.indexOf('m:' + b.dataset.id + ':') !== 0); delete state.seen[b.dataset.id]; save(); rebuild(); render(); } else { b.dataset.sure = 1; b.textContent = 'Tap again'; } }
  else if (act === 'notif') { try { NATIVE.openNotifAccess(); } catch (e) { } }
  else if (act === 'app-settings') { try { NATIVE.openAppSettings(); } catch (e) { } }
  else if (act === 'open-url') { if (NATIVE) { try { NATIVE.openUrl(b.dataset.url); } catch (e) { } } else window.open(b.dataset.url, '_blank', 'noopener'); }
});

rebuild(); render();
})();
</script>
</body>
</html>
